name: Frontend checks

on:
  pull_request:
    paths:
      - "stage4/frontend/**"
      - ".github/workflows/frontend-tests.yml"
  push:
    branches:
      - develop
    paths:
      - "stage4/frontend/**"
      - ".github/workflows/frontend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage4/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stage4/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run form validation tests
        run: npm test

      - name: Type-check source and tests
        run: npm run typecheck:tests

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
