name: Backend checks

on:
  pull_request:
    paths:
      - "stage4/backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - develop
    paths:
      - "stage4/backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage4/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stage4/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check source and tests
        run: npm run typecheck:tests

      - name: Build backend
        run: npm run build
