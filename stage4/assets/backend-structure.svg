<svg xmlns="http://www.w3.org/2000/svg" width="980" height="820" viewBox="0 0 980 820" role="img" aria-labelledby="title desc">
  <title id="title">Oyster Stage 4 Backend Project Structure</title>
  <desc id="desc">Current Express backend folder structure for the Stage 4 Oyster project.</desc>
  <rect width="980" height="820" fill="#f8fafc"/>
  <rect x="28" y="28" width="924" height="764" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Backend Structure</text>
  <text x="56" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">stage4/backend</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#0f172a">
    <text x="64" y="154">stage4/backend</text>
    <text x="84" y="186">|-- prisma/</text>
    <text x="124" y="218">|-- schema.prisma</text>
    <text x="124" y="250">|-- seed.ts</text>
    <text x="124" y="282">`-- migrations/</text>
    <text x="84" y="314">|-- postman/</text>
    <text x="84" y="346">|-- src/</text>
    <text x="124" y="378">|-- admin/, auth/, bookings/, centers/</text>
    <text x="124" y="410">|-- common/</text>
    <text x="164" y="442">|-- catalog/</text>
    <text x="164" y="474">`-- constants/, validation/</text>
    <text x="124" y="506">|-- config/, courses/, health/, instructors/</text>
    <text x="124" y="538">|-- middleware/, payments/, prisma/</text>
    <text x="124" y="570">|-- reviews/, services/, trips/, utils/</text>
    <text x="124" y="602">`-- app.ts, server.ts</text>
    <text x="84" y="642">|-- tests/</text>
    <text x="84" y="674">|-- docker-compose.yml, package.json</text>
    <text x="84" y="706">|-- prisma.config.ts, tsconfig.json</text>
    <text x="84" y="738">`-- vitest.config.ts</text>
  </g>
</svg>
