name: oyster

services:
  db:
    image: postgres:17-alpine
    container_name: oyster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oyster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oyster_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-oyster}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - oyster_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oyster} -d ${POSTGRES_DB:-oyster}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  oyster_postgres_data:
